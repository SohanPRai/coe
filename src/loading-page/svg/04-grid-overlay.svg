<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" class="grid-overlay" aria-hidden="true" role="presentation">
  <defs>
    <!-- Pattern for small micro grid cells -->
    <pattern id="smallGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(248, 250, 252, 0.015)" stroke-width="0.5" />
    </pattern>
    
    <!-- Pattern for large accent grid cells -->
    <pattern id="grid" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="url(#smallGrid)" />
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="rgba(234, 179, 8, 0.035)" stroke-width="0.8" />
    </pattern>
  </defs>
  
  <!-- Fill the entire screen with the tiling grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />
</svg>
