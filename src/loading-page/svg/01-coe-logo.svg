<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" class="coe-logo" role="img" aria-label="Center of Excellence Shield Emblem">
  <defs>
    <!-- Golden Gradients for premium shine -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    
    <!-- Neon Drop Shadow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Border -->
  <path 
    id="outer-hexagon" 
    class="draw-path" 
    d="M 100 15 L 173.6 57.5 L 173.6 142.5 L 100 185 L 26.4 142.5 L 26.4 57.5 Z" 
    fill="none" 
    stroke="url(#gold-grad)" 
    stroke-width="2.5" 
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <!-- Inner Hexagonal Border -->
  <path 
    id="inner-hexagon" 
    class="draw-path" 
    d="M 100 27 L 163.2 63.5 L 163.2 136.5 L 100 173 L 36.8 136.5 L 36.8 63.5 Z" 
    fill="none" 
    stroke="url(#gold-grad)" 
    stroke-width="1.2" 
    stroke-dasharray="4 4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.7"
  />

  <!-- Central Academic-Tech Nodes & Circuit Stylized "C" -->
  <g id="circuit-c" filter="url(#neon-glow)">
    <!-- Circuit lines representing network and paths -->
    <path 
      id="circuit-main" 
      class="draw-path" 
      d="M 140 70 L 90 70 A 30 30 0 1 0 90 130 L 140 130" 
      fill="none" 
      stroke="url(#gold-grad)" 
      stroke-width="4.5" 
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Branch Circuit Lines -->
    <path 
      id="branch-top" 
      class="draw-path" 
      d="M 110 70 L 110 50 L 130 50" 
      fill="none" 
      stroke="url(#gold-grad)" 
      stroke-width="2" 
      stroke-linecap="round" 
    />
    <path 
      id="branch-bottom" 
      class="draw-path" 
      d="M 110 130 L 110 150 L 130 150" 
      fill="none" 
      stroke="url(#gold-grad)" 
      stroke-width="2" 
      stroke-linecap="round" 
    />
    <path 
      id="branch-mid" 
      class="draw-path" 
      d="M 70 100 L 52 100" 
      fill="none" 
      stroke="url(#gold-grad)" 
      stroke-width="2" 
      stroke-linecap="round" 
    />

    <!-- Glowing Nodes/Points -->
    <circle cx="140" cy="70" r="4.5" fill="#fff" stroke="#f59e0b" stroke-width="2" />
    <circle cx="140" cy="130" r="4.5" fill="#fff" stroke="#f59e0b" stroke-width="2" />
    <circle cx="130" cy="50" r="3.5" fill="#fbbf24" />
    <circle cx="130" cy="150" r="3.5" fill="#fbbf24" />
    <circle cx="52" cy="100" r="3.5" fill="#fbbf24" />
    
    <!-- Central Core Energy Node -->
    <circle cx="100" cy="100" r="6" fill="url(#gold-grad)" class="pulse-node" />
  </g>
</svg>
