<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%" class="coe-wordmark" role="img" aria-label="COE Custom Wordmark Logo">
  <defs>
    <filter id="white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#white-glow)"
  >
    <!-- Letter C -->
    <path 
      id="letter-c" 
      class="draw-path" 
      d="M 92 32 A 30 30 0 1 0 92 68" 
    />
    
    <!-- Letter O -->
    <path 
      id="letter-o" 
      class="draw-path" 
      d="M 150 20 A 30 30 0 1 1 149.9 20 Z" 
    />
    
    <!-- Letter E (Spine and arms) -->
    <path 
      id="letter-e-spine" 
      class="draw-path" 
      d="M 208 20 L 208 80" 
    />
    <path 
      id="letter-e-top" 
      class="draw-path" 
      d="M 208 20 L 238 20" 
    />
    <path 
      id="letter-e-mid" 
      class="draw-path" 
      d="M 208 50 L 232 50" 
    />
    <path 
      id="letter-e-bot" 
      class="draw-path" 
      d="M 208 80 L 238 80" 
    />
  </g>
</svg>
